name: Gerar Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar changelog
        run: |
          {
            echo "# Changelog"
            echo ""
            echo "Ultimas alteracoes do projeto:"
            echo ""
            git log -10 --pretty=format:"- %h - %s (%ad)" --date=short
            echo ""
          } > CHANGELOG.md

      - name: Salvar changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: atualiza changelog"
            git push
          fi
