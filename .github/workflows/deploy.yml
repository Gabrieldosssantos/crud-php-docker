
name: Deploy CRUD PHP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v4

      - name: Atualizar aplicacao Docker
        run: |
          docker compose -p crud-php-docker up -d --build
          docker compose -p crud-php-docker ps
