name: Criar Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Criar arquivo ZIP
        run: |
          zip -r projeto-${GITHUB_REF_NAME}.zip . \
            -x ".git/*" \
               ".github/*" \
               "projeto-*.zip"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "projeto-${GITHUB_REF_NAME}.zip" \
            --title "Versao $GITHUB_REF_NAME" \
            --generate-notes
